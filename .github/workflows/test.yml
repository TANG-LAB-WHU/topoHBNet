# GitHub Actions workflow for testing the hbond-topology package
name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system torch==2.5.1 torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          TORCH_VERSION=$(python -c "import torch; print(torch.__version__.split('+')[0])")
          uv pip install --system torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-${TORCH_VERSION}+cpu.html
          uv pip install --system -e ".[full]"

      - name: Run tests
        run: pytest

      - name: Test CLI help
        run: hbond-analyze --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check hbond_topology/ --ignore E501
        continue-on-error: true

      - name: Run ruff format check
        run: ruff format --check hbond_topology/
        continue-on-error: true
